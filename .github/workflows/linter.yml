name: Lint Code Base

concurrency:
  group: lints-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches-ignore:
      - 'gh-pages'
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Code Base with Ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Lint Python Code (Ruff)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "latest"
          args: check
          src: "./gaps"
      - name: Check Python Code Format (Ruff)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "latest"
          args: format --check
          src: "./gaps"
      - name: Check Python Code Complexity (Complexipy)
        uses: rohaquinlop/complexipy-action@f4e40e330aa5a2e7fb5e4336b389de4ee9f5009b # v8.0.1
        with:
          paths: "./gaps"
          max_complexity_allowed: 10
          failed: false  # true
          sort: desc
          ignore_complexity: false  # Set to true to ignore complexity checks
